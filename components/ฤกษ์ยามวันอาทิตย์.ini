ฤกษ์ยามวันอาทิตย์

ฤกษ์ยาม (เวลากลางวัน)

ยาม ๑ สุริชะ ๑ 06.00 น. - 07.30 น.
สุริชะแรกรุ่นแดดอุ่นอ่อน เมื่อวานรเนระคุณลิงจุ่นจิ๋ว เห็นรังนกกระจาบรายบนปลายงิ้ว ก็ไพร่พลิ้วเข้าอาศัยอยู่ในรัง

ยาม ๒ ศุกระ ๖ 07.30 น. - 09.00 น.
ศุกระลิงไพรใจโกหก ลวงให้นกรักใคร่เหมือนใจหวัง จนปักษีมีไข่มิได้ระวัง เพราะเชื่อฟังลมลิงไม่กริ่งใจ

ยาม ๓ พุธะ ๔ 09.00 น. - 10.30 น.
พุธะลิงป่าอุลามก เห็นไข่นกนึกหมายน้ำลายไหล จับขึ้นลูบคลำแล้วกำไว้ อยากจะใคร่ได้กินแลบลิ้นเลีย

ยาม ๔ จันเทา ๒ 10.30 น. - 12.00 น.
จันเทาเอาไข่เข้าใส่ปาก กระโดดจากต้นงิ้วพลิ้วไปเสีย แล้วซ่อนตัวกลัววิหคนกตัวเมีย เอาทรายเกลี่ยกลบไข่เสียให้ลับ

ยาม ๕ เสารี ๗ 12.00 น. - 13.30 น.
เสารีสกุณีไม่เห็นไข่ ก็สงสัยลิงจุ่นมุ่นไปจับ พบลิงไพรถามไตร่ก็ไม่รับ ก็เถียงกับนกกระจาบถึงหยาบคาย

ยาม ๖ ครู ๕ 13.30 น. - 15.00 น.
ยามครูมุนีพิพากษา ว่ามึงมาอาศัยไข่เขาหาย บอกจริง ๆ ลิงจุ่นอย่าวุ่นวาย ลิงผู้ร้ายกลับเถียงขึ้นเสียงดัง

ยาม ๗ ภุมมะ ๓ 15.00 น. - 16.30 น.
ภุมมะพระสิทธาคว้าเชือกเข้า มัดลิงเฒ่าศอกชิดติดสันหลัง จึงคืนไข่ให้นกกระจาบคาบไปรัง แต่ลิงยังไม่พ้นทนทรมา

ยาม ๘ สุริชะ ๑ 16.30 น. - 18.00 น.
สุริชะฤาษีจึงสอนว่า ทีนี้อย่าโว้เว้อ้ายเดระฉาน แล้วปล่อยลิงวิ่งโผนโจนทะยาน ไปสำราญอยู่ที่เขาลำเนาดง

ฤกษ์ยาม (เวลากลางคืน)

ยาม ๑ ระวิ ๑ 18.00 น. - 19.30 น.
ระวิยามงามเลิศประเสริฐทรัพย์ ตามฉบับบอกไว้อย่าไหลหลง มโหสถคิดอ่านการณรงค์ ขุดอุโมงค์เข้าเมืองท้าวจุลนี

ยาม ๒ ชีโว ๕ 19.30 น. - 21.00 น.
ชีโวพลโฮ่กระหึ่มฮืก ออกสอึกองอาจดังราชสีห์ ก็ยกทัพเคลื่อนคลาจากธานี ไปถึงที่ประทับตั้งทัพไชย

ยาม ๓ ศะศิ ๒ 21.00 น. - 22.30 น.
ศะศิตริกล่าวท้าววิเท่ห์ สมคะเนนึกอนงค์ยังหลงไหล ถึงนิเวศน์เวียงวังตั้งพระทัย ตามมโหสถไปไม่ช้าที

ยาม ๔ ศุโกร ๖ 22.30 น. - 24.00 น.
ศุโกรโอ้ท้าวเธอทุกข์เทวษ ทอดพระเนตรนกไม้ในไพรสี แล้วคนึงถึงลูกสาวท้าวจุลนี จนถึงที่กองทัพพลับพลาไชย

ยาม ๕ ภุมโม ๓ 24.00 น. - 01.30 น.
ภุมโมโยธาสิบห้าแสน เสทือนแน่นโลกาสุธาไหว ทั้งแตรสังข์กึกก้องแซ่ซ้องไพร แห่ห้อมล้อมไปจนถึงเมือง

ยาม ๖ โสโร ๗ 01.30 น. - 03.00 น.
เสารีรีบรุดมุดขึ้นได้ ก็จับชาวเวียงไชยมาแน่นเนือง ทั้งลูกสาวเข้าของก็นองเนือง ได้บ้านเมืองหมดทั่วทั้งรั้ววัง

ยาม ๗ พุโธ ๔ 03.00 น. - 04.30 น.
พุโธโอ้ท้าวจุลนีราช แพ้เจ้าปราชญ์คิดไว้ไม่สมหวัง เธอเสียลูกเสียเมียเสียเวียงวัง ก็เสียทั้งไพร่พลแลมนตรี

ยาม ๘ ระวิ ๑ 04.30 น. - 06.00 น.
ระวิยามงามสุดปัจจุสมัย จวนจะใกล้รุ่งรางสว่างศรี ได้เมื่อครั้งคราวท้าวจุลนี เธอเสียทีกับองค์พระทรงญาณ

---

ฤกษ์ยามวันจันทร์

ฤกษ์ยาม (เวลากลางวัน)

ยาม ๑ จันเทา ๒ 06.00 น. - 07.30 น.
จันเทาสว่างกระจ่างแจ้ง สุริย์แสงส่องฟ้าสุธาสถาน ได้เมื่อโฆษกผู้กุมาร เกิดในครรภ์จัณฑาลทรพล

ยาม ๒ เสารี ๗ 07.30 น. - 09.00 น.
เสารีว่าแม่แต่คลอดบุตร ก็แสนสุดยากไร้ไม่เป็นผล ร้อนรุ่มกลุ้มอกยกลูกตน กระเสือกกระสนซ่อนไว้อยู่ในรก

ยาม ๓ ครู ๕ 09.00 น. - 10.30 น.
ยามครูเศรษฐีมาพบเข้าก็อุ้มเอาอิงแอบไว้แนบอก เลี้ยงเป็นบุตรสุดสวาดิ์ในทารก ก็ยอมยกสมบัติให้ครอบครอง

ยาม ๔ ภุมมะ ๓ 10.30 น. - 12.00 น.
ภุมมะเศรษฐีกลับพิโรธ จะทำโทษเฆี่ยนขับให้อับหมอง เป็นยามร้ายหมายจำเอาทำนอง ท่านหมายปองคิดร้ายเมื่อปลายมือ

ยาม ๕ สุริชะ ๑ 12.00 น. - 13.30 น.
สุริชะยามนี้เศรษฐีใช้ เป็นความลึกลับกับหนังสือ หมายจะให้ตายในกลางไฟฮือ ให้เจ้าโฆษกถือเอาไปพลัน

ยาม ๖ ศุกระ ๖ 13.30 น. - 15.00 น.
ศุกระมาปะบุตรเศรษฐี เป็นยามดีชีวาไม่อาสัญ ลูกเศรษฐีมาตายวายชีวัน เจ้าโฆษกผายผันมาเรือนตน

ยาม ๗ พุธะ ๔ 15.00 น. - 16.30 น.
พุธะเศรษฐีสิ้นชีวิต ถึงอนิจกรรมสัตว์วิบัติผล อีกสมบัติวัตถาทั้งข้าคน ยามนี้ร้ายแรงรนไม่สู้ดี

ยาม ๘ จันเทา ๒ 16.30 น. - 18.00 น.
จันเทาเจ้ากุมภะโฆษก ได้ป้องปกสมบัติแห่งเศรษฐี มีเงินทองบ่าวไพร่ได้เป็นดี อยู่แทนที่เศรษฐีสำราญใจ

ฤกษ์ยาม (เวลากลางคืน)

ยาม ๑ ศะศิ ๒ 18.00 น. - 19.30 น.
ศศิยามค่ำคืนคลุ้มชอุ่มศรี เป็นยามดีมั่นคงไม่สงสัย พระเตมีย์มาเถิดกำเนิดใน ชื่นพระทัยชนนียินดีครัน

ยาม ๒ ศุโกร ๖ 19.30 น. - 21.00 น.
ศุโกรเมื่อพระองค์ทรงผนวช เป็นยวดยิ่งยอดงามยามขยัน ทำสิ่งไรก็สำเร็จเสร็จทุกอัน จะรำพรรณทายเทียบเปรียบพิปราย

ยาม ๓ ภุมโม ๓ 21.00 น. - 22.30 น.
ภุมโมเมื่อพระองค์ทรงทำใบ้ ด้วยพระทัยมิได้ตรัสเป็นอรรถฐาน พระตรึกตรองปองประโยชน์โพธิญาณ ตามนิทานว่าไว้ไม่สู้ดี

ยาม ๔ โสโร ๗ 22.30 น. - 24.00 น.
โสโรปางพระโพธิสัตว์นั้น เธอหมายมั่นมัธยัสไม่ถอยดี เมื่อคชสารหาญกล้าเข้าราวี ร้ายกับดีกึ่งกันจงหันตาม

ยาม ๕ พุโธ ๔ 24.00 น. - 01.30 น.
พุโธโอ้พระโพธิสัตว์ไม่ตรัสเหตุ พระปิตุเรศแค้นเคืองด้วยเรื่องถาม ให้ขุดหลุมฝังเสียจะเกลี่ยความ ด้วยเป็นยามร้ายแรงอย่าแคลงใจ

ยาม ๖ ระวิ ๑ 01.30 น. - 03.00 น.
ระวิยามงามเลิศประเสริฐศรี พระเตมีย์แผลงศักดาสุธาไหว แล้วตรัสว่าสารถีที่ตามไป ให้อยู่ในยุติธรรมเป็นสำคัญ

ยาม ๗ ชีโว ๕ 03.00 น. - 04.30 น.
ชีโวโพธิสัตว์เธอตรัสรู้ ได้เป็นครูสิ้นสุดมนุษย์สวรรค์ ในยามนี้ดีเลิศประเสริฐครัน เป็นมหันตมหาโอฬาราน

ยาม ๘ ศะศิ ๒ 04.30 น. - 06.00 น.
ศศิธรค่อนรุ่งอร่ามศรี เป็นยามดีสารพันจะบรรหาร เมื่อพระองค์ทรงบำเพ็ญเล็งพระญาณ จะโปรดปรานสรรพสัตว์โลกา

---

ฤกษ์ยามวันอังคาร

ฤกษ์ยาม (เวลากลางวัน)

ยาม ๑ ภุมมะ ๓ 06.00 น. - 07.30 น.
ภุมมะรุ่งรางกระจ่างฉาย ดีกับร้ายกึ่งกันจงหันหา เมื่อกระบือชื่อพญาทรพา อยู่ในป่าตัวเดียวเที่ยวกระเจิง

ยาม ๒ สุริชะ ๑ 07.30 น. - 09.00 น.
สุริชะเมื่อได้บริวาร แสนสำราญวิ่งโลดโดดเถลิง เกิดกำลังตั้งท่าทำร่าเริง เที่ยวแลเบิ่งเป็นใหญ่ในฝูงควาย

ยาม ๓ ศุกระ ๖ 09.00 น. - 10.30 น.
ศุกระยามนี้เมื่อมีบุตร มารดาสุดรักใคร่ไม่ขยาย สู้ถนอมกล่อมเกลี้ยงเลี้ยงลูกชาย ไม่กล้ำกลายกลัวพ่อทรพา

ยาม ๔ พุธะ ๔ 10.30 น. - 12.00 น.
พุธะมารดาพาไปซ่อน ในดงดอนเข้าอยู่ใต้คูหา เป็นยามดีมิให้ได้ระอา เทวดาผดุงบำรุงตน

ยาม ๕ จันเทา ๒ 12.00 น. - 13.30 น.
จันเทาทรพีมันมีฤทธิ์ ออกเที่ยวขวิดภูผาโกลาหล แล้ววัดรอยพ่อดูจะสู้ชน เป็นยามคนคิดร้ายเอาปลายมือ

ยาม ๖ เสารี ๗ 13.30 น. - 15.00 น.
เสารีทรพีไม่ย่อท้อ เข้าสู้พ่อชนได้ไม่ใช่หรือ เป็นยามร้ายรุมใจดังไฟฮือ ตอนปลายมือแพ้คนทุพลพาล

ยาม ๗ ครู ๕ 15.00 น. - 16.30 น.
ยามครูทรพาก็อาสัญ ด้วยลูกมันขวิดขวับดับสังขาร ร้ายนักหนาสารพรรณจะบันดาล อย่าทำการยามนี้ชีวาวาย

ยาม ๘ ภุมมะ ๓ 16.30 น. - 18.00 น.
ภุมมะทรพีมีชัยพ่อ ในใจคอสำราญบานขยาย ก็ตั้งตัวเป็นใหญ่ในฝูงควาย แสนสบายยามนี้เห็นดีครัน

ฤกษ์ยาม (เวลากลางคืน)

ยาม ๑ ภุมโม ๓ 18.00 น. - 19.30 น.
ภุมโมยามค่ำร่ำว่าให้ปรากฏ เหมือนพระรถปรีเปรมเกษมสันติ์ ขึ้นจากอุโมงทรงม้าอาชาพลัน ในยามนั้นดีแท้เป็นแน่นอน

ยาม ๒ โสโร ๗ 19.30 น. - 21.00 น.
โสโรเหมือนพระรสยศไกร เล่นสบ้ามีไชยสโมสร เป็นยามดีมีสง่าสถาพร เล่นพะนันผันผ่อนจะมีไชย

ยาม ๓ พุโธ ๔ 21.00 น. - 22.30 น.
พุโธโอ้พระรถยศยิ่ง ได้ทรัพย์สิ่งโภคาเป็นไหนๆ มาเลี้ยงดูมารดาอันยาใจ ยามนี้ใช้ได้ดอกบอกอาการ

ยาม ๔ ระวิ ๑ 22.30 น. - 24.00 น.
ระวิตริตรองดึกสงัด บิดาตรัสใช้ให้ถือหนังสือสาร หวังจะให้ลูกชายนั้นวายปราน ไม่ได้การยามนี้ไม่ดีเลย

ยาม ๕ ชีโว ๕ 24.00 น. - 01.30 น.
ชีโวฤาษีอันมีเวท ได้ทราบเหตุแปลงสารเสียเฉย ๆ หวังจะให้ได้เมรีมาชมเชย พระรถเลยไปตามเป็นยามดี

ยาม ๖ ศศิ ๒ 01.30 น. - 03.00 น.
ศศิริรักประจักษ์แล้ว จึงม้าแก้วพาเหาะระเห็จหนี ข้ามคงคาเหาะคว้างกลางเมฆี ยามนี้ดีกับร้ายระคนกัน

ยาม ๗ ศุโกร ๖ 03.00 น. - 04.30 น.
ศุโกรเมื่อเมรีไม่เห็นผัว ให้หมองมัวตามหาถึงอาสัญ ยามนี้ร้ายอย่าได้จรจรัล อย่าผูกพันไมตรีจะมีภัย

ยาม ๘ ภุมโม ๓ 04.30 น. - 06.00 น.
ภุมโมเมื่อม้าพาพระรถ ข้ามบรรพตโขดเขินเนินไสล มาถึงเมืองบิดานราไทย สำราญใจพระรสยศยง

---

ฤกษ์ยามวันพุธ

ฤกษ์ยาม (เวลากลางวัน)

ยาม ๑ พุธะ ๔ 06.00 น. - 07.30 น.
พุธะโพธิสัตว์พระฉัตทันต์ จากสวรรค์มาเกิดในไพรระหง เป็นใหญ่กว่าฝูงช้างในกลางดง พระองค์ทรงสิลาบารมี

ยาม ๒ จันเทา ๒ 07.30 น. - 09.00 น.
จันเทานางช้างทั้งหลายล้อม สพรั่งพร้อมเป็นชะนัดล้วนหัตถี ก็อยู่เย็นเป็นสุขทุกราตรี มิได้มีภยันต์อันตราย

ยาม ๓ เสารี ๗ 09.00 น. - 10.30 น.
เสารีได้เมื่อนางจุลสุพัตรา ผูกเวราเวรไว้เหมือนใจหมาย ปองจะฆ่าพญาฉัตทันต์พลาย ยามนี้ร้ายศัตรูมักดูแคลน

ยาม ๔ ครู ๕ 10.30 น. - 12.00 น.
ยามครูนางช้างไม่วางโศก บังเกิดโรคในทรวงเพราะหวงแหน อกแตกตายวายชีวงในดงแดน ยามนี้แสนร้ายสุดไม่อุดม

ยาม ๕ ภุมมะ ๓ 12.00 น. - 13.30 น.
ภุมมะจุลสุบัติอุบัติแล้ว เป็นนางแก้วเจ้าถนอมจอมสนม ได้สมบัติพัสถานสำราญรมณ์ นางก็ชมเชยชื่นทุกคืนวัน

ยาม ๖ สุริชะ ๑ 13.30 น. - 15.00 น.
สุริชะนางกษัตริย์จึงตรัสว่า จะใคร่นอนแท่นงาอันเฉิดฉัน เฝ้าอ้อนวอนบิดาแล้วจาบัลย์ ด้วยยามนั้นไม่ร้ายพอใช้การ

ยาม ๗ ศุกระ ๖ 15.00 น. - 16.30 น.
ศุกระพรานไพรน้ำใจกล้า รับอาสาท้าวไทเข้าไพรสาณฑ์ เป็นยามดีและได้สมอารมณ์พราน ไปพบพานโพธิสัตว์พระฉัตทันต์

ยาม ๘ พุธะ ๔ 16.30 น. - 18.00 น.
โพธิสัตว์ยอดหัตถา ก็ถอดงาออกให้ขมีขมัน แล้วพระองค์มรณาในป่าวัน ในยามนั้นต้องห้ามตามนิยาย

ฤกษ์ยาม (เวลากลางคืน)

ยาม ๑ พุโธ ๔ 18.00 น. - 19.30 น.
พุโธโพล้เพล้ราวพลบค่ำ พระลอล้ำงามเลิศอันเฉิดฉาย จากนครจรมาเอกากายค่อยผันผายตามไก่เข้าในดง

ยาม ๒ ระวิ ๑ 19.30 น. - 21.00 น.
ระวิยามตามมาในป่ากว้าง ได้พบนางพี่น้องสองนวลหง เจรจาพาทีไมตรีตรง ให้พระองค์อาศัยในอุทยาน

ยาม ๓ ชีโว ๕ 21.00 น. - 22.30 น.
ชีโวยามดีไม่มีแหนง เจ้าเพื่อนแพงโฉมงามทรามสงสาร ปรพคองเคียงเลี้ยงดูพระกุมาร แสรสำราญพระทัยไม่ไคลคลา

ยาม ๔ ศศิ ๒ 22.30 น. - 24.00 น.
ศศิตริตรองไม่นึกแหนง สองเพื่อนแพงปลอบไธ้ให้หรรษา เกษมสรวลชวนชมภิรมยา อยู่ในป่าสำราญบานพระทัย

ยาม ๕ ศุโกร ๖ 24.00 น. - 01.30 น.
ศุโกรโอ้ท้าวเธอเศร้าจิต คนึงคิดถึงมารดาน้ำตาไหล ไม่สู้ดียามนี้มักตรอมใจ อุปมัยเหมือนความตามเรื่องราว

ยาม ๖ ภุมโม ๓ 01.30 น. - 03.00 น.
ภุมโมเมื่อพระลอเธอพลัดพราก กำจัดจากมารดานิราสถาน เพราะปู่เจ้าเข้าดลกมลมาน อย่าทำการยามนี้ผีคนอง

ยาม ๗ โสโร ๗ 03.00 น. - 04.30 น.
โสโรโอ้พระลอวรนาถ คิดถึงนุชสุดสวาทเธอทั้งสอง จรจากพารามาหาน้อง ยามนี้ต้องต้นร้ายตอนปลายดี

ยาม ๘ พุโธ ๔ 04.30 น. - 06.00 น.
พุโธพระลอเฉลิมภพ มาประสบพบนางอยู่ปรางค์ศรี สุขเกษมเปรมปราทุกราตรี เป็นยามดีจงจำเอาตำรา

---

ฤกษ์ยามวันพฤหัสบดี

ฤกษ์ยาม (เวลากลางวัน)

ยาม ๑ ครู ๕ 06.00 น. - 07.30 น.
พระครูเรียงความตามนิบาต กุศราชเรืองฤทธิทุกทิศา เกิดในวงพงษ์กษัตริย์ขัติยา เป็นมหาสมมุติวงศ์ผู้ทรงนาม

ยาม ๒ ภูมมะ ๓ 07.30 น. - 09.00 น.
ภุมมะพระได้เสวยราช ทั้งเปรื่องปราชญ์ฤาเลื่องเรืองสนาม แต่รูปทรงของพระองค์ไม่สู้งาม แต่ว่ายามนี้ดีดังมีมา

ยาม ๓ สุริชะ ๑ 09.00 น. - 10.30 น.
สุริชะพระได้มเหสี ชื่อประภาวดีเสน่หา ประคองเคียงเพียงดวงนัยนา ครองพาราเป็นสุขสนุกสบาย

ยาม ๔ ศุกระ ๖ 10.30 น. - 12.00 น.
ศุกระประภาวดีหนี ไปบุรีบิตุเรศอันเรืองฉาย กุศราชร้อนใจไม่สบาย เป็นยามร้ายร้อนรนพ้นประมาณ

ยาม ๕ พุธะ ๔ 12.00 น. - 13.30 น.
พุธะยามพระกุศราช ไปตามนาฏถึงประเทศเขตสถาน จนพบองค์นงเยาว์ลำเภาพาน แต่ภูบาลยังมิได้เข้าใกล้นาง

ยาม ๖ จันเทา ๒ 13.30 น. - 15.00 น.
จันเทาท้าวไทพิไรร่ำ ทุกคืนค่ำกำสดสลดหมาง ไม่สู้ดียามนี้ก็เป็นกลาง มักจะร้างแรมรักษ์ประจักษ์ใจ

ยาม ๗ เสารี ๗ 15.00 น. - 16.30 น.
เสารีกุศราชชนะศึก ก็สมนึกยินดีจะมีไหน ทำสงครามยามนี้จะมีไชย จงจำไว้เป็นอย่างอย่าคลางแคลง

ยาม ๘ ครู ๕ 16.30 น. - 18.00 น.
ยามครูบริสุทธิ์พระกุศราช เสวยราชฤาทั่วกลัวแสยง สมดังจิตคิดไว้มิได้แคลง กุศลแต่งให้ดีมีบุญญษ

ฤกษ์ยาม (เวลากลางคืน)

ยาม ๑ ชีโว ๕ 18.00 น. - 19.30 น.
ชีโวอุตโมโอฬาร์ล้ำ เวลาค่ำยามนี้ดีหนักหนา ได้เมื่อสุทธนูกุมารา อาชาพาลดเลี้ยวเที่ยวหาเมีย

ยาม ๒ ศศิ ๒ 19.30 น. - 21.00 น.
ศศิได้พบประสบพักตร์ อารีรักร่วมใจจนได้เสีย ไม่อิ่มหนำค่ำเช้าเฝ้าเคล้าเคลีย หาลูกเมียยามนี้ดีสุดใจ

ยาม ๓ ศุโกร ๖ 21.00 น. - 22.30 น.
ศุโกรสุทธนูพาคู่ชื่น เสด็จคืนพาราอันผ่องใส อยู่ด้วยประภาเป็นยาใจ ในเวียงไชยชื่นชมภิรมยา

ยาม ๔ ภุมโม ๓ 22.30 น. - 24.00 น.
ภุมโมชมชิดพิศวาท ด้วยนางนาฏน้องน้อยเสน่หา เสวยรมณ์ชมแสนสวรรยา ทั้งสองรารื่นเริงบรรเทิงใจ

ยาม ๕ โสโร ๗ 24.00 น. - 01.30 น.
โสโรเมื่อม้าอาชาชาติ พานางนาฏข้ามเขิมเนินไศล ไปหามารดาด้วยอาลัย แต่ว่าไปไม่ถึงได้กึ่งทาง

ยาม ๖ พุโธ ๔ 01.30 น. - 03.00 น.
พุโธอาศัยอยู่ในป่า พลัดกับม้านุชน้องก็หมองหมาง มีโจรไพรใจกล้ามาลักนาง อย่าเดินทางไปไกลภัยจะมี

ยาม ๗ ระวิ ๑ 03.00 น. - 04.30 น.
ระวินี้นงเยาว์สำเภาแตก ลำบากกายว่ายแวกวารีศรี ห้ามมิให้เดินทางกลางนัทธี เหตุจะมีเหมือนกันดังพรรณา

ยาม ๘ ชีโว ๕ 04.30 น. - 06.00 น.
ชีโวสุริโยอโณภาส อนงค์นาฏเดินไพรไกลหนักหนา ได้พบม้าชื่นชมสมจินดา ก็พักพากันไปดังใจปอง

---

ฤกษ์ยามวันศุกร์

ฤกษ์ยาม (เวลากลางวัน)

ยาม ๑ ศุกระ ๖ 06.00 น. - 07.30 น.
ศุกระยามมหาสถาผล พระสุทนมาเกิดกำเนิดสนอง เป็นกษัตริย์ฟุ้งเฟื่องอันเรืองรอง ได้ครอบครองสมบัติสวัสดี

ยาม ๒ พุธะ ๔ 07.30 น. - 09.00 น.
พุธะพระได้มะโนเรศ เป็นปิ่นเกษไกรลาศคีริศรี โฉมสำอางค์นางฟ้ากุมารี พระภูมีเชยชมภิรมย์ทรวง

ยาม ๓ จันเทา ๒ 09.00 น. - 10.30 น.
จันเทาเยาวเรศเหตุจะมี พบฤาษีนางสั่งถึงวังหลวง เป็นยามเศร้าโศกาน้ำตาตวง ประดุจดวงชีวิตจะปลิดปลง

ยาม ๔ เสารี ๗ 10.30 น. - 12.00 น.
เสารีสามีเที่ยวตามหา แสนโศกามาในไพรระหง ถึงอาศรมฤาษีที่กลางดง พระนงลักษณ์ถามไถ่อยู่ไปมา

ยาม ๕ ครู ๕ 12.00 น. - 13.30 น.
ยามครูมุนีก็ชี้ช่อง เหมือนทำนองนางสั่งไม่กังขา พระจดจำถ้อยคำแล้วอำลา ยามนี้หนาลำบากด้วยจากกัน

ยาม ๖ ภุมมะ ๓ 13.30 น. - 15.00 น.
ภุมมะพระไปเหมือนใจหวัง ขึ้นขี่หลังนกใหญ่ข้ามไพรสันฑ์ ถึงไกรลาศยาร์ตเยื้องจรจรัล เข้าเขตขันฑ์เสมาพระธานี

ยาม ๗ สุริชะ ๑ 15.00 น. - 16.30 น.
สุริชะมาปะเมื่อนางสรง แล้วให้พระธำรงค์อันเรื่องศรี รู้ว่าอธิบดินทร์ก็ยินดี กินนรีสอดดูพระภูธร

ยาม ๘ ศุกระ ๖ 16.30 น. - 18.00 น.
ศุกระพระได้เสวยสุข นิราศทุกข์ภิญโญสโมสร ได้นางคืนชื่นจิตต์สนิทนอน สถาพรพูลสวัสดิ์เป็นอัตรา

ฤกษ์ยาม (เวลากลางคืน)

ยาม ๑ ศุโกร ๖ 18.00 น. - 19.30 น.
ศุโกรโอฬาร์มหาวิเศษ เหมือนพระเวสสันดรนาถา ครองพิภพสีพีเธอปรีดา ฝูงประชาชนชื่นทุกคืนวัน

ยาม ๒ ภุมโม ๓ 19.30 น. - 21.00 น.
ภุมโมยามร้ายให้ขัดขวาง เธอให้ช้างเผือกผู้ตัวขยัน พลเมืองกริ้วโกรธต้องโทษทัณฑ์ ก็ชวนกันปรึกษาว่าไม่ดี

ยาม ๓ โสโร ๗ 21.00 น. - 22.30 น.
โสโรร้ายได้เมื่อบิดาโกรธ คุมโทษสำทับต้องขับหนี ไม่เอาไว้ให้อยู่ในบุรี ด้วยทำผิดประเพณีแต่บุราณ

ยาม ๔ พุโธ ๔ 22.30 น. - 24.00 น.
พุโธสี่กษัตริย์กำจัดจาก แสนลำบากบุกป่านิราสถาน ละห้อยให้โหยใจในดงดาร ถึงสถานวงกตคีรีราย

ยาม ๕ ระวิ ๑ 24.00 น. - 01.30 น.
ระวิชูชกไปตามขอ สองพระหน่อน้อยนาฏดังมาตร์หมาย ได้แล้วพามาเมืองอันเรืองพราย ฝูงอำมาตย์ทั้งหลายก็จับเอา

ยาม ๖ ชีโว ๕ 01.30 น. - 03.00 น.
ชีโวกรุงสญไชยไถ่พระหลาน ด้วยแสนทรัพย์ศฤงคารให้พราหมณ์เฒ่า เป็นยามดีมีลาภไม่บันเทา จงจดจำเอาตำหรับฉบับครู

ยาม ๗ ศะศิ ๒ 03.00 น. - 04.30 น.
ศศิตรวจตราช้างม้าเสด็จ รับพระเวสสันดรนเรนทร์สูรย์ ไพร่พลแห่ห้อมไปพร้อมมูล เสด็จยูรยาตร์สู่บุรีรมย์

ยาม ๘ ศุโกร ๖ 04.30 น. - 06.00 น.
ศุโกรพระบิดาราชาภิเษก เป็นองค์เอกกษัตริย์อันสูงสม เเิมมิ่งมงกุฏอันอุดม เป็นบรมสุโขภิญโญยศ

---

ฤกษ์ยามวันเสาร์

ฤกษ์ยาม (เวลากลางวัน)

ยาม ๑ เสารี ๗ 06.00 น. - 07.30 น.
เสารีมีกำลังดังช้างสาร กำแหงหาญฤทธาอันปรากฏ เมื่อนางอัสมูขีมีพยศ เป็นกำหนดในยามตามเรื่องราว

ยาม ๒ ครู ๕ 07.30 น. - 09.00 น.
พระครูยามพบพราหมณ์เอาเป็นผัว จำแลงตัวตุ้งติ้งเป็นหญิงสาว บำเรอรักภักดีไม่มีดาว ทุกค่ำเช้าเชยชิดสนิทนอน

ยาม ๓ ภุมมะ ๓ 09.00 น. - 10.30 น.
ภุมมะเกิดบุตรอันสุดที่รัก ชื่อบุญลักษณ์เรืองฤทธิมหิศร สุขเกษมเปรมปราสถาพร ยังไม่จรจากสถานของมารดา

ยาม ๔ สุริชะ ๑ 10.30 น. - 12.00 น.
สุริชะลักพาบิดาหนี ข้ามคีรีห้วยธารละหานผา ไม่รั้งรอตั้งแต่จะรีบมา ยามหนีหนาพากันหนีดีสุดใจ

ยาม ๕ ศุกระ ๖ 12.00 น. - 13.30 น.
ศุกระมาปะแม่น้ำกว้าง ยืนอยู่ข้างมหาชลาไหล เป็นยามดีหนีรอดเปล่าปลอดไป ไม่มีภัยแผ้วพาลสำราญกาย

ยาม ๖ พุธะ ๔ 13.30 น. - 15.00 น.
พุธะนางยักษ์ประจักษ์เหตุ ชลเนตรคลอคลองลงนองสาย ไปตามลูกกับผัวแทบตัวตาย เป็นยามร้ายเร่งจำเอาทำนอง

ยาม ๗ จันเทา ๒ 15.00 น. - 16.30 น.
จันเทานางถึงแก่วินาสน์ โอรสราชทดแทนพระคุณสนอง ไม่สู้ดียามนี้ชี้ทำนอง นางจึงต้องมรณาพิลาลัย

ยาม ๘ เสารี ๗ 16.30 น. - 18.00 น.
เสารีนี้ได้เมื่อพระลูกรัก เจริญศักดิ์โสภาจะหาไหน ได้ครอบครองบุรีไม่มีภัย สำราญใจทุกวันนิรันดร

ฤกษ์ยาม (เวลากลางคืน)

ยาม ๑ โสโร ๗ 18.00 น. - 19.30 น.
โสโรหนุมานอันชาญกล้า รับอาสาทรงฤทธิ์มหิศร พบฤาษีกราบก้มประนมกร อาศัยนอนที่ศาลาในราตรี

ยาม ๒ พุโธ ๔ 19.30 น. - 21.00 น.
พุโธหนุมานทยานเหาะ หมายเอาเกาะลงกาอันเรืองศรี ก็เหาะลงตรงราชธานี เป็นยามดีติดสมอารมณ์ลิง

ยาม ๓ ระวิ ๑ 21.00 น. - 22.30 น.
ระวิตริตรองมองเขม่น ก็แลเห็นสีดาพระยาหญิง สังเกตุดูยลแยบคอยแอบอิง เป็นความจริงซื่อสัตย์ต่อภัสดา

ยาม ๔ ชีโว ๕ 22.30 น. - 24.00 น.
ชีโวยอมกายถวายแหวน แต่นางแสนเศร้าสร้อยละห้อยหา

ยาม ๕ ศะศิ ๒ 24.00 น. - 01.30 น.
ศศิหนุมานชาญศักดา เข้าฉุดคร่าปั่นป่วนสวนมาลี

ยาม ๖ ศุกโร ๖ 01.30 น. - 03.00 น.
ศุโกรฆ่าสหัสสบุตร์ลงม้วยมรณ์ ข่าวขจรฤาชาถึงทศศรี

ยาม ๗ ภุมโม ๓ 03.00 น. - 04.30 น.
ภุมโมอินทรชิตเข้าต่อตี จับได้กระบี่ก็มัดมา

ยาม ๘ โสโร ๗ 04.30 น. - 06.00 น.
โสโรเกือบจะใกล้อรุณรุ่ง หนุมานเผากรุงท้าวยักษา อัฏฐกาลสองสถานรำพรรณมา แม้ยาตราเลือกเดินที่ยามดี

